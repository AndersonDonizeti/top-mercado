name: Build Android APK (TWA)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK Bubblewrap
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Instalar Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Gerar/atualizar projeto Android
      run: bubblewrap update --skipPwaValidation

    - name: Criar key.properties com senha do keystore
      working-directory: android
      run: |
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=android\nstoreFile=%s/android.keystore\n' \
          "${{ secrets.KEYSTORE_STORE_PASSWORD }}" \
          "${{ secrets.KEYSTORE_KEY_PASSWORD }}" \
          "$(pwd)" > key.properties

    - name: Build via Gradle (sem prompt)
      working-directory: android
      run: ./gradlew assembleRelease

    - name: Salvar o APK (Upload)
      uses: actions/upload-artifact@v4
      with:
        name: TopMercado-APK
        path: android/app/build/outputs/apk/release/*.apk
