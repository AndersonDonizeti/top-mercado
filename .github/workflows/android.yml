name: Build Android APK (TWA)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build APK Bubblewrap
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java (JDK 21)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Instalar Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Construir o APK
      run: echo "n" | bubblewrap build

    - name: Salvar o APK (Upload)
      uses: actions/upload-artifact@v4
      with:
        name: TopMercado-APK
        path: app-release-signed.apk
