name: Publicar APK Pronto

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  upload:
    name: Upload APK Pronta
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Salvar o APK (Upload)
      uses: actions/upload-artifact@v4
      with:
        name: TopMercado-APK
        path: android/*.apk
