<!-- FORMULÁRIO DE CADASTRO DE COMPRA -->
<div class="form-grid">
    <!-- Data -->
    <div class="form-group">
        <label for="purchaseDate"><i class="far fa-calendar"></i> Data</label>
        <input type="date" id="purchaseDate" />
    </div>

    <!-- Produto com Autocomplete -->
    <div class="form-group">
        <label for="productInput"><i class="fas fa-tag"></i> Produto</label>
        <div class="autocomplete-wrapper">
            <input type="text" id="productInput" placeholder="Ex: Arroz, Leite..." autocomplete="off" />
            <ul class="autocomplete-list" id="autocompleteList"></ul>
        </div>
    </div>

    <!-- Preço -->
    <div class="form-group">
        <label for="priceInput"><i class="fas fa-dollar-sign"></i> Preço (R$)</label>
        <input type="number" id="priceInput" placeholder="0,00" step="0.01" min="0" />
    </div>

    <!-- Quantidade -->
    <div class="form-group">
        <label for="qtyInput"><i class="fas fa-weight-hanging"></i> Quantidade</label>
        <input type="number" id="qtyInput" placeholder="1" step="0.01" min="0.01" value="1" />
    </div>

    <!-- Unidade de Medida -->
    <div class="form-group">
        <label for="unitSelect"><i class="fas fa-ruler"></i> Unidade</label>
        <select id="unitSelect">
            <option value="un">un</option>
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="L">L</option>
            <option value="mL">mL</option>
            <option value="pacote">pacote</option>
            <option value="cx">cx</option>
        </select>
    </div>

    <!-- Ações -->
    <div class="form-actions">
        <button class="btn btn-primary" id="addBtn">
            <i class="fas fa-plus"></i> Adicionar Compra
        </button>
        <button class="btn btn-outline" id="clearFormBtn">
            <i class="fas fa-undo"></i> Limpar
        </button>
    </div>
</div>

<!-- LISTAGEM DE COMPRAS DO DIA -->
<div class="today-purchases">
    <h3><i class="fas fa-list-ul"></i> Compras de <span id="todayLabel">...</span></h3>

    <!-- Busca Rápida -->
    <div class="today-search">
        <input type="text" id="todaySearchInput" placeholder="🔍 Filtrar produtos desta data..." />
        <span class="result-count" id="todayResultCount">0 itens</span>
    </div>

    <!-- Container da Lista -->
    <div id="todayList">
        <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p>Nenhuma compra registrada para este dia.</p>
        </div>
    </div>
</div>
