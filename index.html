<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Top Mercado</title>
    
    <!-- PWA e Estilos -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- HEADER FIXO -->
    <header class="app-header">
        <h1><i class="fas fa-shopping-cart"></i> Top Mercado</h1>
        <span class="subtitle" id="headerDate">Carregando...</span>
    </header>

    <!-- ÁREA DINÂMICA (Páginas injetadas aqui) -->
    <main id="app-content" class="app-container">
        <!-- O conteúdo de /pages/ será renderizado aqui -->
    </main>

    <!-- NAVEGAÇÃO INFERIOR -->
    <nav class="bottom-nav" id="tabNav">
        <button class="tab-btn active" data-route="adicionar">
            <i class="fas fa-plus-circle"></i> <span>Comprar</span>
        </button>
        <button class="tab-btn" data-route="mes">
            <i class="fas fa-calendar-month"></i> <span>Mês</span>
        </button>
        <button class="tab-btn" data-route="relatorio">
            <i class="fas fa-chart-simple"></i> <span>Relatório</span>
        </button>
        <button class="tab-btn" data-route="produtos">
            <i class="fas fa-boxes"></i> <span>Produtos</span>
        </button>
    </nav>

    <!-- SCRIPTS CORE -->
    <script src="js/utils.js"></script>
    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                .catch(err => console.log('Erro ao registrar Service Worker:', err));
        });
    }
</script>
</body>
</html>
